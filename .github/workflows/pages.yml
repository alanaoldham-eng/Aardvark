name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # skip the full-size source art in design/ so deploys stay fast
          sparse-checkout: |
            /*
            !/design/
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@v5
      # Publish the site only: design/ (full-size source art) and supabase/ stay out
      - name: Build site folder
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '/design' --exclude '/supabase' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
